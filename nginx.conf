server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Astro static assets with immutable cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pagefind search assets
    location /pagefind/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Clean URLs & dynamic routing fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Backward compatibility redirect if /my-tech-blog is accessed
    location ^~ /my-tech-blog/ {
        rewrite ^/my-tech-blog/(.*)$ /$1 permanent;
    }

    error_page 404 /404.html;
}
